name: Testes cumulativos
on:
  push:
    branches: [main, 'projeto/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Selecionar contrato da branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          case "$BRANCH" in
            projeto/00-ambiente) etapa=00 ;;
            projeto/01-aquisicao) etapa=01 ;;
            projeto/02-controle) etapa=02 ;;
            projeto/03-supervisor|projeto/04-entrega) etapa=03 ;;
            main) etapa=$(cat ETAPA_ATUAL) ;;
            *) echo "Branch sem etapa prevista: $BRANCH"; exit 1 ;;
          esac
          echo "ETAPA=$etapa" >> "$GITHUB_ENV"
      - run: make test ETAPA="$ETAPA"
      - name: Medir cobertura dos mesmos testes
        if: always()
        run: make cobertura ETAPA="$ETAPA"
      - name: Guardar evidências de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: build/relatorios/
          if-no-files-found: ignore
          retention-days: 14
